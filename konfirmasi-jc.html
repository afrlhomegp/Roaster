  :root{
    --bg:#000000; --bg2:#0d0d0f; --panel:#151517; --panel2:#1d1d20;
    --line:#2a2a2e; --line2:#3a3a40;
    --txt:#f3f4f6; --txt2:#b4b6bd; --txt3:#8a8d96;
    --accent:#f5a623; --accent2:#ffc14d;
    --blue:#4f9dff; --teal:#22c1c3;
    --red:#ff5a5a; --redbg:#3a1620; --orange:#ff8c3b; --orangebg:#3a2415;
    --yellow:#ffd23f; --yellowbg:#3a3415; --green:#3fd77a; --greenbg:#15321f;
    --shadow:0 10px 30px rgba(0,0,0,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Archivo',sans-serif;background:var(--bg);color:var(--txt);
    background-image:radial-gradient(circle at 12% 0%,rgba(255,255,255,.035),transparent 40%),
      radial-gradient(circle at 88% 100%,rgba(245,166,35,.05),transparent 45%);
    min-height:100vh;font-size:14px}
  .mono{font-family:'Spline Sans Mono',monospace}
  /* Top bar */
  header{position:sticky;top:0;z-index:50;background:var(--hbg,rgba(8,8,10,.92));
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 22px;padding-top:env(safe-area-inset-top,0px)}
  body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .hwrap{display:flex;align-items:center;gap:18px;height:62px;max-width:1500px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16px;letter-spacing:-.3px}
  .logo .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#e07a00);
    display:grid;place-items:center;font-size:18px;box-shadow:0 4px 14px rgba(245,166,35,.4)}
  .logo small{display:block;font-size:10px;font-weight:500;color:var(--txt3);letter-spacing:.5px;text-transform:uppercase}
  
  
  /* ===== Header notification bell ===== */
  .bellbtn{position:relative;margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.15s}
  .bellbtn.has{animation:bellRing 2.6s ease-in-out infinite;transform-origin:50% 4px}
  @keyframes bellRing{0%,55%,100%{transform:rotate(0)}58%{transform:rotate(14deg)}62%{transform:rotate(-12deg)}66%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}74%{transform:rotate(0)}}
  .bell-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;font-family:'Spline Sans Mono';display:flex;align-items:center;justify-content:center;border:2px solid var(--bg2);box-shadow:0 2px 6px rgba(0,0,0,.4);animation:badgePulse 1.4s infinite}
  @keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,90,.6)}50%{box-shadow:0 0 0 6px rgba(255,90,90,0)}}
  .bellpop-back{position:fixed;inset:0;z-index:115;display:none}
  .bellpop-back.show{display:block}
  .bellpop{position:fixed;top:64px;right:14px;width:min(380px,calc(100vw - 28px));max-height:72vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;box-shadow:0 22px 60px rgba(0,0,0,.55);z-index:116;display:none;animation:fade .18s ease}
  .bellpop.show{display:block}
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  /* Desktop: popup notifikasi lebih lebar & teks deskripsi (mis. botol) tidak terpotong — dibuat membungkus (wrap), bukan dipotong ellipsis */
  @media(min-width:1001px){
    .bellpop{width:min(480px,calc(100vw - 40px));max-height:78vh}
    .bellpop .bp-row{align-items:flex-start}
    .bellpop .bp-job{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;word-break:break-word}
    .bellpop .bp-meta{white-space:normal;line-height:1.3}
    .bellpop .bp-mc{margin-top:1px}
  }
  /* Nav */
  nav{display:flex;gap:3px;padding:0 14px;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(8,8,10,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    overflow-x:auto;position:fixed;bottom:0;left:0;right:0;z-index:60;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
  nav .nwrap{display:flex;gap:3px;max-width:1500px;margin:0 auto;width:100%;justify-content:center}
  nav button{position:relative;background:none;border:none;color:var(--txt2);padding:9px 14px 10px;font-family:inherit;
    font-size:11px;font-weight:600;cursor:pointer;border-top:2.5px solid transparent;white-space:nowrap;
    transition:.15s;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:62px}
  nav button.on{color:var(--accent2);border-top-color:var(--accent);background:rgba(245,166,35,.06)}
  nav button .ic2{font-size:17px;line-height:1}
  nav button .badge{position:absolute;top:3px;right:8px;background:var(--red);color:#fff;font-size:10px;padding:0 5px;border-radius:9px;font-weight:700}
  main{max-width:1500px;margin:0 auto;padding:22px 22px 96px}
  .view{display:none;animation:fade .35s ease}

  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2.title{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-bottom:3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ============================================================
   OPTIMALISASI SENTUH & MOBILE
   Diletakkan paling akhir supaya menimpa aturan di atasnya.
   ============================================================ */

/* --- 1. Sentuhan terasa langsung: tanpa kilatan biru, tanpa jeda 300ms --- */
html{ -webkit-tap-highlight-color:transparent; }
button,.btn,.ico-btn,.chip,.fchip,
nav button,.fabmenu-item,.x,.bellbtn,.seg,.di,label.sw,.fab{
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
/* teks data tetap bisa disorot & disalin */
td,th,.note,.sub,input,textarea,select{ -webkit-user-select:text; user-select:text; }

/* --- 2. iOS: input dengan huruf < 16px membuat layar ikut ter-zoom saat disentuh,
        dan tidak kembali sendiri. Di layar kecil huruf input dinaikkan ke 16px. --- */
@media (max-width:1000px){
  input:not([type=checkbox]):not([type=radio]),
  select,textarea{ font-size:16px !important; }
  /* saat keyboard muncul, sisakan ruang supaya kolom yang diisi tidak tertutup */
  input,select,textarea{ scroll-margin-bottom:150px; scroll-margin-top:90px; }
}

/* --- 3. Target sentuh minimal ~44px (standar Apple & Google) --- */
@media (hover:none){
  /* dibesarkan pas: cukup untuk jari, tapi TIDAK saling tumpang tindih
     dengan tombol baris di atas/bawahnya (agar tidak salah hapus baris) */
  .ico-btn{ width:36px; height:36px; font-size:15px; }
  .btn.sm{ padding:10px 16px; font-size:12px; }
  
  .mbox .mh .x{ width:42px; height:42px; }

  /* kotak centang baris riwayat: bawaan ~13px, terlalu kecil untuk jari */
  
  

  /* jarak antar chip sedikit dilonggarkan supaya tidak salah tekan */
  .chip,.fchip{ margin-bottom:2px; }
}

/* --- 4. Tombol tambah (FAB) tidak tertutup bar bawah / home indicator --- */
@media (max-width:1000px){
  .fab{ bottom:max(88px, calc(env(safe-area-inset-bottom,0px) + 78px)); right:16px; }
}

/* --- 5. Tabel lebar: batang gulir tipis yang selalu terlihat, supaya jelas
        masih ada kolom di sebelah kanan --- */
@media (hover:none){
  .tblwrap,.mscroll{ scrollbar-width:thin; scrollbar-color:var(--line2) transparent; }
  .tblwrap::-webkit-scrollbar{ height:5px; }
  .tblwrap::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:3px; }
  .tblwrap::-webkit-scrollbar-track{ background:transparent; }
}

/* --- 6. Gulir lebih rapi: tarikan di dalam pop-up tidak menarik halaman di belakangnya --- */
/* PENTING: hanya sumbu MENDATAR yang boleh di-"contain".
   Kalau kedua sumbu di-contain, putaran roda mouse / dua jari di trackpad saat kursor
   berada di atas tabel akan ditelan wadah tabel dan TIDAK diteruskan ke halaman —
   akibatnya halaman hanya bisa digulir kalau kursor ditaruh di pinggir tabel. */
.tblwrap{ -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; overscroll-behavior-y:auto; }

     Animasi transform+opacity jalan di compositor, tetap halus walau JS sibuk.
     PMBoot.done() menyembunyikan; failsafe 12 dtk. ===== -->
<style id="pmSplashCss">
#pmSplash{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:#25282f;transition:opacity .3s ease}
html.boot-light #pmSplash{background:#f0f3f7}
#pmSplash.pms-out{opacity:0;pointer-events:none}
#pmSplashIcon{width:84px;height:84px;border-radius:21px;animation:pmsPulse 1.1s ease-in-out infinite}
@keyframes pmsPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.88);opacity:.6}}
@media (prefers-reduced-motion:reduce){#pmSplashIcon{animation:none}#pmSplash{transition:none}}
</style>
<div id="pmSplash" role="status" aria-label="Memuat aplikasi">
  <img id="pmSplashIcon" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
</div>
<script>/* QW-P4 (rev): modul PMBoot minimal */
window.PMBoot=(function(){
  var box=document.getElementById('pmSplash'),hidden=false;
  try{var l=document.querySelector('link[rel="icon"]'),im=document.getElementById('pmSplashIcon');if(l&&im)im.src=l.href;}catch(e){}
  function done(){if(hidden||!box)return;hidden=true;box.classList.add('pms-out');
    setTimeout(function(){try{box.remove();}catch(e){if(box.parentNode)box.parentNode.removeChild(box);}
      var c=document.getElementById('pmSplashCss');if(c&&c.parentNode)c.parentNode.removeChild(c);},320);}
  setTimeout(done,12000);
  return {done:done,set:function(){}};
})();</script>

/* ---------- transport: JSONP (baca) & POST (tulis) ---------- */
function gsJsonp(params, cb, timeoutMs){
  if(!Cloud.url){ cb(new Error('URL kosong')); return; }
  const id='__pmcb'+(++_jsonpN)+'_'+Date.now().toString(36);
  const s=document.createElement('script');
  let done=false, tm=null;
  const finish=(err,data)=>{ if(done)return; done=true; clearTimeout(tm); window[id]=function(){}; try{s.remove();}catch(_){ } cb(err,data); };
  window[id]=function(data){ finish(null,data); };
  s.onerror=function(){ finish(new Error('tidak bisa menghubungi server (cek internet / URL / deploy "Anyone")')); };
  tm=setTimeout(()=>finish(new Error('timeout — server tidak menjawab')), timeoutMs||20000);
  const q=Object.keys(params).filter(k=>params[k]!==undefined&&params[k]!==null).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
  s.src=Cloud.url+(Cloud.url.indexOf('?')<0?'?':'&')+q+'&callback='+id+'&_t='+Date.now();
  document.body.appendChild(s);
}
function syncGet(params, timeoutMs){
  return new Promise((resolve,reject)=>{
    const p=Object.assign({ app:APP_BUILD, proto:SYNC_PROTO, room:Cloud.room, dev:syncDevId(), tok:syncTok() }, params||{});
    gsJsonp(p,(err,j)=>err?reject(err):resolve(j), timeoutMs);
  });
}

/* Tulis: fetch POST (jawaban langsung dibaca). Bila diblokir CORS / dibuka sebagai file lokal →
   form tersembunyi + baca hasilnya lewat JSONP "result" (server menyimpan hasil per tx). */
async function syncPost(body){
  const text=JSON.stringify(body);
  const unreachable='tidak bisa menghubungi server — data aman di perangkat, dicoba ulang otomatis';
  if(Sync.mode!=='form'){
    try{
      const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
      const t=setTimeout(()=>{ try{ ctl&&ctl.abort(); }catch(e){} }, 60000);
      const r=await fetch(Cloud.url,{ method:'POST', body:text, redirect:'follow', signal:ctl?ctl.signal:undefined });
      clearTimeout(t);
      const j=await r.json(); Sync.mode='fetch'; return j;
    }catch(e){
      if(typeof navigator!=='undefined' && navigator.onLine===false) throw new Error('perangkat sedang offline — data aman di perangkat');
      // fetch gagal: jawaban diblokir CORS (server tetap memproses) atau jaringan putus → tanyakan hasil tx lewat JSONP
      let j=null; try{ j=await syncGet({action:'result', tx:body.tx}, 15000); }catch(e2){ throw new Error(unreachable); }
      if(j && j.code!=='PENDING'){ if(j.ok) Sync.mode='form'; return j; }
    }
  }
  _ensureSyncForm();
  const frm=document.getElementById('__syncFrm'); frm.action=Cloud.url;
  frm.querySelector('input[name=body]').value=text; frm.submit();
  let fails=0;
  for(let i=0;i<14;i++){
    await syncSleep(i<2?1500:2200);
    let j=null;
    try{ j=await syncGet({action:'result', tx:body.tx}, 15000); fails=0; }
    catch(e){ if(++fails>=2) throw new Error(unreachable); continue; }
    if(j && j.code==='PENDING') continue;
    if(j){ if(j.ok) Sync.mode='form'; return j; }
  }
  throw new Error('server belum mengonfirmasi kiriman — dicoba ulang otomatis');
}

let _idbP=null;
function syncIdb(){
  if(_idbP) return _idbP;
  _idbP=new Promise(res=>{
    try{
      if(!window.indexedDB){ res(null); return; }
      const rq=indexedDB.open('pm_sync',1);
      rq.onupgradeneeded=()=>{ try{ rq.result.createObjectStore('kv'); }catch(e){} };
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
      setTimeout(()=>res(null),5000);
    }catch(e){ res(null); }
  });
  return _idbP;
}
async function syncKvGet(k){
  const db=await syncIdb();
  if(db){ try{ const v=await new Promise(res=>{ const tx=db.transaction('kv','readonly'); const rq=tx.objectStore('kv').get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(undefined); }); if(v!==undefined) return v; }catch(e){} }
  try{ const s=localStorage.getItem('pm_kv_'+k); return s?JSON.parse(s):undefined; }catch(e){ return undefined; }
}
async function syncKvSet(k,v){
  const db=await syncIdb();
  if(db){ try{ await new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); try{ localStorage.removeItem('pm_kv_'+k); }catch(e){} return true; }catch(e){} }
  try{ localStorage.setItem('pm_kv_'+k, JSON.stringify(v)); return true; }catch(e){ return false; }
}

function syncCmpOf(c,v){ if(v===undefined) return undefined; if(c==='img') return 'R'+((v&&v.rev)||denahImgRev((v&&v.img)||'')); return JSON.stringify(v); }
function syncLocalCmp(ctx,k){
  const [c,id]=syncSplit(k);
  if(SYNC_ARR[c]){ const r=ctx.idx(c).get(id); return r?JSON.stringify(r):undefined; }
  if(c==='act'){ const a=actionStatus||{}; return (Object.prototype.hasOwnProperty.call(a,id)&&a[id]!==undefined)?JSON.stringify(a[id]):undefined; }
  if(c==='cfg'){ const v=syncCfgVal(id); return (v===undefined||typeof v==='function')?undefined:JSON.stringify(v); }
  if(c==='img'){ const img=denahImgGet(); return img?('R'+syncImgRev(img)):undefined; }
  return undefined;
}
function syncSetLocal(ctx,k,v){
  const [c,id]=syncSplit(k); ctx.touched=true;
  if(SYNC_ARR[c]){
    if(!v||typeof v!=='object') return;
    const m=ctx.idx(c), cur=m.get(id);
    if(cur && typeof cur==='object'){ Object.keys(cur).forEach(f=>{ if(!(f in v)) delete cur[f]; }); Object.assign(cur,v); }   // di tempat: referensi lama tetap valid
    else { const arr=SYNC_ARR[c](); arr.push(v); m.set(id,v); }
    if(ctx.removed[c]) ctx.removed[c].delete(id);
  } else if(c==='act'){ if(!actionStatus||typeof actionStatus!=='object') actionStatus={}; actionStatus[id]=v; }
  else if(c==='cfg'){
    if(CFG_LOCAL_KEYS[id]) return;
    if(id==='denah'){ const img=denahImgGet(); v=(v&&typeof v==='object')?Object.assign({},v):{racks:[]}; v.img=img; }
    CFG[id]=v; ctx.cfg=true;
  } else if(c==='img'){
    CFG.denah=(CFG.denah&&typeof CFG.denah==='object')?CFG.denah:{img:'',racks:[]};
    CFG.denah.img=(v&&typeof v.img==='string')?v.img:''; ctx.img=true;
  }
}
function syncRemoveLocal(ctx,k){
  const [c,id]=syncSplit(k); ctx.touched=true;
  if(SYNC_ARR[c]){ (ctx.removed[c]||(ctx.removed[c]=new Set())).add(id); ctx.idx(c).delete(id); }
  else if(c==='act'){ if(actionStatus) delete actionStatus[id]; }
  else if(c==='cfg'){ if(CFG_LOCAL_KEYS[id]) return; if(id in DEFAULT_CFG) CFG[id]=JSON.parse(JSON.stringify(DEFAULT_CFG[id])); else delete CFG[id]; ctx.cfg=true; }
  else if(c==='img'){ if(CFG.denah) CFG.denah.img=''; ctx.img=true; }
}

function syncFinishCtx(ctx, noSave){

/* Gabung 3 arah per field: field yang hanya diubah di perangkat ini dipertahankan, field yang hanya
   diubah di server diambil; bila keduanya mengubah field yang sama → yang lebih baru menang. */
function syncMerge3(base, local, server, lt, st){
  if(!syncIsObj(local)||!syncIsObj(server)) return (lt>=st)?local:server;
  const J=x=>x===undefined?undefined:JSON.stringify(x);
  const out=Object.assign({},server), hasBase=syncIsObj(base);
  const keys=new Set(Object.keys(local)); if(hasBase) Object.keys(base).forEach(f=>keys.add(f));
  keys.forEach(f=>{
    const lv=J(local[f]), sv=J(server[f]);
    if(lv===sv) return;
    if(hasBase){ const bv=J(base[f]); if(lv===bv) return; if(sv!==bv && st>lt) return; }
    else if(st>lt) return;
    if(local[f]===undefined) delete out[f]; else out[f]=local[f];
  });
  return out;
}

/* ---------- terapkan item dari server: [key, rev, del, mt, by, data] ---------- */
function syncApplyItems(items, opts){
  opts=opts||{};
  const ctx=syncCtx(), map=Sync.map||(Sync.map={}), adm=(syncRoleEff()==='admin');
  let nIn=0, nMerge=0, nDel=0, maxMt=0;
  if(!opts.initial){ let pre=0; items.forEach(it=>{ if(it&&it[2]&&syncLocalCmp(ctx,String(it[0]))!==undefined) pre++; }); if(pre>=10) snapshotSave('sebelum menerima '+pre+' penghapusan dari server'); }
  items.forEach(it=>{
    if(!it) return;
    const k=String(it[0]), rev=+it[1]||0, del=!!it[2], mt=+it[3]||0, v=it[5];
    if(!rev||k.indexOf(':')<1) return;
    const c=k.slice(0,k.indexOf(':'));
    const sh=map[k];
    if(sh && sh[0]>=rev) return;                                   // sudah punya versi ini
    const loc=syncLocalCmp(ctx,k), srv=del?undefined:syncCmpOf(c,v), base=sh?sh[1]:undefined;
    const dirty=(base===undefined||base===null)?(loc!==undefined):(loc!==base);
    if(mt>maxMt) maxMt=mt;
    if(!dirty || (!adm && SYNC_ADMIN_COLS[c])){                    // tidak ada perubahan lokal → ambil versi server
      if(del){ if(loc!==undefined){ syncRemoveLocal(ctx,k); nDel++; } delete map[k]; }
      else { if(loc!==srv){ syncSetLocal(ctx,k,v); nIn++; } map[k]=[rev,srv]; }
      return;
    }
    const lt=opts.initial?(del?0:(Sync.legacy?syncNow():0)):(Sync.dt[k]||syncNow());
    Sync.needDiff=true;
    if(del){
      if(loc===undefined){ delete map[k]; }                                      // sama-sama dihapus
      else if(mt>lt){ syncRemoveLocal(ctx,k); delete map[k]; nDel++; }           // hapus di server lebih baru
      else { map[k]=[rev,null]; nMerge++; }                                      // edit lokal lebih baru → dikirim ulang
    } else if(loc===undefined){                                                  // dihapus di sini, diubah di server
      if(mt>lt){ syncSetLocal(ctx,k,v); nIn++; }
      map[k]=[rev,srv];
    } else if(loc===srv){ map[k]=[rev,srv]; }
    else if(c==='img' || !syncIsObj(v)){                                         // tanpa field → versi terbaru menang
      if(mt>lt){ syncSetLocal(ctx,k,v); nIn++; } else nMerge++;
      map[k]=[rev,srv];
    } else {
      let b=null; if(typeof base==='string'){ try{ b=JSON.parse(base); }catch(e){ b=null; } }
      let l=null; try{ l=JSON.parse(loc); }catch(e){ l=null; }
      syncSetLocal(ctx,k,syncMerge3(b,l,v,lt,mt)); map[k]=[rev,srv]; nMerge++;
    }
  });
  syncFinishCtx(ctx);
  if(maxMt){ try{ if(maxMt>lastModTime()){ CFG.lastMod=maxMt; localStorage.setItem('pm_lastmod',String(maxMt)); } }catch(e){} }
  const n=nIn+nDel;
  if(!opts.quiet && (n||nMerge)) toast('☁️ '+(n?n+' perubahan dari perangkat lain diterima':'')+(nMerge?((n?' · ':'')+nMerge+' data digabung otomatis'):''));
  return {nIn,nDel,nMerge};
}
/* Data lengkap dari server (sinkron pertama, atau perangkat terlalu lama offline). */
function syncApplyFull(items, initial){
  const srv=new Set(items.map(it=>String(it[0])));
  const cur=syncCollectLocal(), ctx=syncCtx(), old=Sync.map||{};
  const unknown=[]; cur.forEach((cmp,k)=>{ if(!srv.has(k)) unknown.push(k); });
  if(initial) snapshotSave('sebelum sinkron pertama');
  else {   // cadangan hanya bila sinkron penuh ini akan menghapus data di perangkat
    let risk=0;
    unknown.forEach(k=>{ const sh=old[k]; if(sh && sh[1]!==null && sh[1]===cur.get(k)) risk++; });
    items.forEach(it=>{ if(it && it[2] && cur.has(String(it[0]))) risk++; });
    if(risk) snapshotSave('sebelum sinkron penuh ('+risk+' data dihapus di server)');
  }
  let nRm=0;
  if(initial){
    Sync.map={};
    const dataUnknown=unknown.filter(k=>!SYNC_ADMIN_COLS[k.slice(0,k.indexOf(':'))]);
    if(items.length && dataUnknown.length){
      const keep=confirm('☁️ Sinkron pertama dengan server\n\nPerangkat ini punya '+dataUnknown.length+' data (record / plan JC / stock / ceklist / status action) yang belum ada di server.\n\nOK = kirim ke server (data baru dari perangkat ini)\nBatal = buang dari perangkat ini (mis. data lama yang sudah dihapus di perangkat lain)\n\nCadangan otomatis sudah dibuat dulu — Admin bisa memulihkannya di Settings.');
      if(!keep) dataUnknown.forEach(k=>{ syncRemoveLocal(ctx,k); nRm++; });
    }
  } else {
    const m={}; Object.keys(old).forEach(k=>{ if(srv.has(k)) m[k]=old[k]; });
    // pernah tersinkron & tidak diubah di sini, tapi sudah tidak ada di server → sudah dihapus
    unknown.forEach(k=>{ const sh=old[k]; if(sh && sh[1]!==null && sh[1]===cur.get(k)){ syncRemoveLocal(ctx,k); nRm++; } });
    Sync.map=m;
  }
  syncFinishCtx(ctx, true);
  const r=syncApplyItems(items, {initial:!!initial, quiet:true});
  if(nRm) ctx.touched=true;
  if(nRm && !r.nIn && !r.nDel && !r.nMerge){ try{ saveLocal(); }catch(e){} if(!cloudBusy()){ try{ buildNav(); render(); }catch(e){} } }
  const n=r.nIn+r.nDel+nRm;
  if(n||r.nMerge) toast('☁️ Sinkron '+(initial?'pertama':'penuh')+' selesai'+(n?' · '+n+' perubahan':'')+(r.nMerge?' · '+r.nMerge+' digabung':''));
}

/* ---------- daftar kirim (diff terhadap shadow) ---------- */
function syncOutbox(){
  syncEnsureIds();
  const cur=syncCollectLocal(), map=Sync.map||(Sync.map={}), now=syncNow(), adm=(syncRoleEff()==='admin');
  const out=[];
  cur.forEach((cmp,k)=>{ const sh=map[k]; if(sh && sh[1]===cmp) return; out.push({k, b:sh?sh[0]:0, d:0, cmp}); });
  Object.keys(map).forEach(k=>{ if(cur.has(k)) return; const sh=map[k]; if(sh[1]===null){ delete map[k]; return; } out.push({k, b:sh[0], d:1, cmp:null}); });
  const keys=new Set();
  out.forEach(o=>{ keys.add(o.k); if(!Sync.dt[o.k]) Sync.dt[o.k]=now; o.mt=Sync.dt[o.k]; });
  Object.keys(Sync.dt).forEach(k=>{ if(!keys.has(k)) delete Sync.dt[k]; });
  const send=[], localCfg=[];
  out.forEach(o=>{
    const c=o.k.slice(0,o.k.indexOf(':'));
    if(SYNC_ADMIN_COLS[c] && !adm){ localCfg.push(o.k); return; }
    if(Sync.forbidden[o.k]) return;
    if(!o.d) o.s=(o.k==='img:denah')?JSON.stringify({img:denahImgGet(), rev:syncImgRev(denahImgGet())}):o.cmp;
    send.push(o);
  });
  const sig=localCfg.sort().join('|');
  if(Sync.userEdit && localCfg.length && sig!==Sync.cfgDirtyPrev && Sync.attached && syncTok()){
    const added=localCfg.filter(k=>Sync.cfgDirtyPrev.split('|').indexOf(k)<0);
    if(added.length) toast('⚙️ Perubahan pengaturan ini hanya berlaku di perangkat ini — perlu PIN Admin agar dibagikan');
  }
  Sync.cfgDirtyPrev=sig; Sync.userEdit=false;
  Sync.nCfgLocal=localCfg.length; Sync.nOut=send.length; Cloud.dirty=send.length>0;
  Sync.needDiff=false;
  return send;
}
function syncCanWrite(){ return Sync.attached && !Sync.blocked && !!syncTok() && (syncRoleEff()==='admin' || Sync.init); }

/* ---------- siklus sinkron: (konflik) → kirim → tarik ---------- */
function syncSchedule(ms){ if(!Cloud.enabled) return; clearTimeout(Sync.timer); Sync.timer=setTimeout(()=>syncCycle('local'), ms==null?800:ms); }
async function syncCycle(why){
  if(!Cloud.enabled||!Cloud.url||Sync.blocked||!syncTok()) return;
  if(Sync.running){ Sync.again=true; return; }
  Sync.running=true; Sync.cycleErr=false;
  try{
    await syncLoadShadow();
    if(!Sync.attached){ if(!(await syncAttach())) return; }
    for(let loop=0; loop<4; loop++){
      if(Sync.conflicts.length){ if(cloudBusy()) Sync.deferred=true; else await syncResolveConflicts(); }
      if(Sync.cycleErr) break;
      const out=syncOutbox();
      if(out.length && syncCanWrite()){ if(!(await syncPush(out))) break; }
      await syncPull();
      if(Sync.cycleErr||Sync.deferred) break;
      if(!Sync.needDiff && !Sync.conflicts.length) break;
    }
    if(!Sync.cycleErr){ Cloud.status='connected'; Cloud.connected=true; Cloud.err=''; if(Sync.attached) Sync.okOnce=true; }
  }catch(e){ console.warn('sync:',e); syncNetErr(e); }
  finally{
    Sync.running=false; syncSaveShadowSoon(); syncPaint();
    if(Sync.okOnce&&!Sync._cdMig&&!CFG._jcCdFix&&isAdminUI()){ Sync._cdMig=true; setTimeout(jcCdMaybeMigrate,60); }   /* sekali: part ikut CD */
    if(Sync.again){ Sync.again=false; syncSchedule(400); }
  }
}
async function syncAttach(){
  if(cloudBusy()){ Sync.deferred=true; return false; }
  let j; try{ j=await syncGet({action:'pull', since:0, tomb:1}, 120000); }catch(e){ syncNetErr(e); return false; }
  if(!j||!j.ok||j.proto==null){ syncServerErr(j); return false; }
  if(cloudBusy()){ Sync.deferred=true; return false; }
  const adm=(syncRoleEff()==='admin'), items=j.items||[];
  if(!items.length && !adm){ Sync.init=false; Sync.attached=false; syncPaint(); return false; }   // server kosong → tunggu Admin
  try{ Sync.legacy=(localStorage.getItem('pm_dirty')==='1'); }catch(e){ Sync.legacy=false; }
  Sync.dt={}; Sync.conflicts=[]; Sync.forbidden={};
  syncApplyFull(items, true);
  Sync.sid=j.sid||''; Sync.lastRev=+j.rev||0; Sync.attached=true; Sync.init=(Sync.lastRev>0)||adm; Sync.legacy=false; Sync.deferred=false;
  clearDirty();
  Sync.needDiff=true; syncSaveShadowNow();
  return true;
}
async function syncPush(out){
  const MAXN=250, MAXB=1500000; let i=0;
  while(i<out.length){
    const batch=[]; let bytes=0;
    while(i<out.length && batch.length<MAXN && (bytes<MAXB||!batch.length)){ const o=out[i++]; batch.push(o); bytes+=(o.s?o.s.length:0)+80; }
    const tx=syncDevId()+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
    const body={ action:'push', app:APP_BUILD, proto:SYNC_PROTO, room:Cloud.room, dev:syncDevId(), tok:syncTok(),
      by:(typeof curUser==='function'?(curUser()||''):''), tx,
      changes:batch.map(o=>o.d?{k:o.k,b:o.b,d:1,mt:o.mt}:{k:o.k,b:o.b,mt:o.mt,s:o.s}) };
    Cloud.pending=tx; Cloud.pendingSince=Date.now(); syncPaint();
    let j;
    try{ j=await syncPost(body); }catch(e){ Cloud.pending=null; syncNetErr(e); return false; }
    Cloud.pending=null;
    if(!j||!j.ok||j.proto==null){ syncServerErr(j); return false; }
    const byK={}; batch.forEach(o=>{ byK[o.k]=o; });
    (j.applied||[]).forEach(a=>{ const k=a[0], rev=+a[1]||0, o=byK[k]; if(!o) return;
      if(o.d||!rev) delete Sync.map[k]; else Sync.map[k]=[rev,o.cmp];
      delete Sync.dt[k]; });
    (j.rejected||[]).forEach(r=>{ const k=r[0], why=r[1];
      if(why==='conflict'){ if(Sync.conflicts.indexOf(k)<0) Sync.conflicts.push(k); }
      else Sync.forbidden[k]=why||'ditolak'; });
    if(j.role && !Sync.adminTok && j.role!==Sync.role){ Sync.role=j.role; syncSaveCreds(); }
    Sync.lastOk=Date.now(); syncSaveShadowSoon();
  }
  Sync.nOut=Sync.conflicts.length; Cloud.dirty=Sync.conflicts.length>0;
  return true;
}
async function syncResolveConflicts(){
  const keys=Sync.conflicts.slice(); Sync.conflicts=[];
  for(let i=0;i<keys.length;i+=60){
    const part=keys.slice(i,i+60); let j;
    try{ j=await syncGet({action:'items', keys:JSON.stringify(part)}, 30000); }
    catch(e){ Sync.conflicts=Sync.conflicts.concat(keys.slice(i)); syncNetErr(e); return; }
    if(!j||!j.ok){ Sync.conflicts=Sync.conflicts.concat(keys.slice(i)); syncServerErr(j); return; }
    if(cloudBusy()){ Sync.conflicts=Sync.conflicts.concat(keys.slice(i)); Sync.deferred=true; return; }
    syncApplyItems(j.items||[], {});
  }
}
async function syncPull(){
  if(cloudBusy()){ Sync.deferred=true; return false; }
  const since=+Sync.lastRev||0; let j;
  try{ j=await syncGet({action:'pull', since, tomb:1}, since?45000:120000); }catch(e){ syncNetErr(e); return false; }
  if(!j||!j.ok||j.proto==null){ syncServerErr(j); return false; }
  if(cloudBusy()){ Sync.deferred=true; return false; }
  Sync.deferred=false;
  if(j.sid && Sync.sid && j.sid!==Sync.sid){ Sync.attached=false; return false; }   // server berganti → sinkron awal ulang
  if(j.full) syncApplyFull(j.items||[], (+j.rev<since));                           // revisi mundur = server direset
  else if(j.items && j.items.length) syncApplyItems(j.items, {});
  Sync.lastRev=+j.rev||0; Sync.init=Sync.lastRev>0||syncRoleEff()==='admin';
  syncSaveShadowSoon();
  return true;
}
async function syncPoll(force){
  if(!Cloud.enabled||!Cloud.url||Sync.blocked==='old') return;
  if(Sync.running) return;
  if(!force && document.hidden && Date.now()-Sync.lastPing<60000) return;      // hemat kuota saat aplikasi di latar
  if(!syncTok()){ syncPaint(); return; }
  let j; const t0=Date.now();
  try{ j=await syncGet({action:'ping'}, 15000); }catch(e){ syncNetErr(e); return; }
  Sync.lastPing=Date.now();
  if(!j||!j.ok||j.proto==null){ Sync.cycleErr=false; syncServerErr(j); return; }
  if(j.t) Sync.skew=j.t-Math.round((t0+Sync.lastPing)/2);
  if(j.need && +j.need>APP_BUILD){ syncServerErr({code:'OLD_APP',proto:SYNC_PROTO}); return; }
  if(Sync.blocked==='server') Sync.blocked='';
  Cloud.connected=true;
  if(Cloud.status==='error'){ Cloud.status='connecting'; Cloud.err=''; }
  if(!Sync.adminTok && j.role && j.role!==Sync.role){ Sync.role=j.role; syncSaveCreds(); }
  Sync.init=(+j.rev>0);
  if(Sync.sid && j.sid && j.sid!==Sync.sid) Sync.attached=false;
  if(!Sync.attached || +j.rev!==+Sync.lastRev || Sync.needDiff || Cloud.dirty || Sync.conflicts.length || Sync.deferred) syncCycle('poll');
  else { Cloud.status='connected'; syncPaint(); }
}
function syncListeners(){
  if(Sync._ls) return; Sync._ls=true;
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) syncSaveShadowNow(); else setTimeout(()=>syncPoll(true),300); });
  window.addEventListener('online',()=>setTimeout(()=>syncPoll(true),600));
  window.addEventListener('pagehide',()=>{ try{ syncSaveShadowNow(); }catch(e){} });
  // modal ditutup / fokus input lepas → tarik data yang tertunda
  document.addEventListener('focusout',()=>{ if(Sync.deferred) setTimeout(()=>{ if(Sync.deferred&&!cloudBusy()) syncCycle('deferred'); },700); });
  document.addEventListener('click',()=>{ if(Sync.deferred) setTimeout(()=>{ if(Sync.deferred&&!cloudBusy()) syncCycle('deferred'); },900); });
}
function gsConnect(cfg){

function cloudBusy(){

/* ============ COMPUTE ENGINE ============ */
function classifyCat(reason){ return rgOf(reason).name; }   /* nama bab: Job Change / Roaster / Trouble */

function lifetimeOf(part){ return CFG.lifetimes[part]||90; }
function warnDaysFor(part){ var d=+CFG.warnDiv||2; return Math.max(1,Math.round(lifetimeOf(part)/d)); }
function urgentDaysFor(part){ var d=+CFG.urgentDiv||4; return Math.max(1,Math.round(lifetimeOf(part)/d)); }
function statusOf(rem,part){ if(rem<0)return'OVERDUE'; var u=(part!=null)?urgentDaysFor(part):(+CFG.urgent||7); var w=(part!=null)?warnDaysFor(part):(+CFG.warning||14); if(rem<=u)return'URGENT'; if(rem<=w)return'WARNING'; return'OK'; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function parseD(s){ const d=new Date(s+'T00:00:00'); d.setHours(0,0,0,0); return d; }
function fmtD(d){ if(!d)return'—'; const x=(d instanceof Date)?d:parseD(d); return String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+x.getFullYear(); }

// enrich records with category & sorted; compute actual lifetime
function enriched(){
  const list=DB.map((r,i)=>{const g=rgOf(r.reason);return {...r,_i:i,cat:g.name,gid:g.id,planned:!!g.planned,lt:lifetimeOf(r.part),d:parseD(r.date)};});
  // actual lifetime = gap from previous same combo
  const groups={};
  [...list].sort((a,b)=>a.d-b.d).forEach(r=>{
    const k=r.machine+'|'+r.section+'|'+r.part;
    r.actual = groups[k]!==undefined ? daysBetween(groups[k],r.d) : null;
    groups[k]=r.d;
  });
  return list;
}
// monitoring: latest per machine|section|part combo (only combos that exist in data)
function monitoring(){
  const list=enriched(); const combo={};
  list.forEach(r=>{
    const k=r.machine+'|'+r.section+'|'+r.part;
    if(!combo[k]||r.d>combo[k].last){ combo[k]=combo[k]||{machine:r.machine,section:r.section,part:r.part,count:0,trouble:0}; }
  });
  // recompute counts & last
  Object.keys(combo).forEach(k=>{combo[k].count=0;combo[k].trouble=0;combo[k].last=null;});
  list.forEach(r=>{
    const k=r.machine+'|'+r.section+'|'+r.part; const o=combo[k];
    o.count++; if(r.cat==='Trouble')o.trouble++;
    if(!o.last||r.d>o.last)o.last=r.d;
  });
  return Object.values(combo).map(o=>{
    const lt=lifetimeOf(o.part); const nd=new Date(o.last.getTime()+lt*86400000);
    const rem=daysBetween(TODAY,nd); const st=statusOf(rem,o.part);
    return {...o,lt,nextDue:nd,rem,status:st,key:o.machine+'|'+o.section+'|'+o.part};
  }).sort((a,b)=>a.rem-b.rem);
}

function clampScale(n){ n=Math.round((+n||100)/5)*5; if(n<50)n=50; if(n>200)n=200; return n; }

   Patokan desain 1600×800 px (ukuran jendela browser, sudah termasuk skala Windows & zoom browser) = 100%.
   skala = min(lebar ÷ 1600, tinggi ÷ 800) × 100, dibulatkan 5%, batas 90–130%. HP & tablet (≤1000 px) = 100%.
   Lalu dikali UI_SCALE (0,75 → semua 25% lebih kecil; HP & tablet jadi 75%).
   Dihitung ulang saat jendela diubah ukurannya / dipindah ke monitor lain / layar diputar.
   (Setelan lama uiScale / uiScaleAuto / uiScaleAdj diabaikan.) */
const SCALE_REF={w:1600,h:800,min:90,max:130};
function autoScaleCalc(){ const w=window.innerWidth||1280, h=window.innerHeight||800;
  if(w<=1000) return 100;   /* HP & tablet: tata letaknya sudah khusus */
  const r=Math.min(w/SCALE_REF.w, h/SCALE_REF.h)*100;
  return Math.max(SCALE_REF.min,Math.min(SCALE_REF.max,Math.round(r/5)*5)); }
const UI_SCALE=0.75;   /* semua halaman (IS Machine & Konfirmasi JC): tampilan 25% lebih kecil dari skala otomatis — HP & desktop */
function effScale(){ return clampScale(autoScaleCalc()*UI_SCALE); }
function uiZ(){ const z=parseFloat(document.documentElement.style.zoom); return (isFinite(z)&&z>0)?z:1; }   /* faktor zoom aktif: koordinat layar ÷ uiZ() = px CSS */
function scaleInfoHTML(){ const w=window.innerWidth||0, h=window.innerHeight||0;
  return '🖥️ Perangkat ini: layar '+w+'×'+h+' → <b>'+effScale()+'%</b>'+(w<=1000?' (HP / tablet selalu '+Math.round(100*UI_SCALE)+'%)':''); }
function applyScale(){ var n=effScale();
  try{ document.documentElement.style.zoom = (n/100); }catch(e){}
  // beri tahu CSS faktor zoom agar layout satu-layar (dashboard desktop) bisa mengisi penuh tinggi walau di-scale
  try{ document.documentElement.style.setProperty('--uizoom', (n/100)); }catch(e){}

   • aturan CSS font-size ditulis ulang dari nilai aslinya (bar menu bawah HP dibiarkan, ruangnya sempit),

function _fsVal(orig,f){ const v=String(orig||'').trim(); if(f===1||!v) return v;

function toggleDashFilter(force){

function updateFilterHandle(){
  var onDash=(typeof current!=='undefined' && current==='dash');
  if(!onDash){
    document.body.classList.remove('dffilter-open');
    document.body.classList.remove('dffilter-active');

  var h=document.getElementById('filterHandle'); if(!h) return;

function initFilterSwipe(){
  if(window._fhSwipe) return; window._fhSwipe=true;

    var h=document.getElementById('filterHandle');
    if(h){ var sy=0,sx=0,mv=false;
      h.addEventListener('touchstart',function(e){var t=e.touches[0];sy=t.clientY;sx=t.clientX;mv=false;},{passive:true});
      h.addEventListener('touchmove',function(e){var t=e.touches[0];if(Math.abs(t.clientY-sy)>10)mv=true;},{passive:true});

    document.addEventListener('touchstart',function(e){ var p=e.target&&e.target.closest&&e.target.closest('.dashfilter'); onPanel=!!(p&&document.body.classList.contains('dffilter-open')); if(onPanel){py=e.touches[0].clientY;pmoved=false;} },{passive:true});

/* HP: share sheet (WA, Drive, galeri) · desktop / "Simpan": unduh file */
async function kfRepShare(blob,name,save){
  if(!save){ try{ const f=new File([blob],name,{type:blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]})&&window.matchMedia&&matchMedia('(pointer:coarse)').matches){ await navigator.share({files:[f],title:name}); return; } }
    catch(e){ if(e&&e.name==='AbortError') return; } }
  dl(blob,name); }
async function kfRepPdf(save){ let R=null; try{ R=kfRepCur(); if(!R) return; await kfRepShare(kfPdfBlob(R.pages),kfRepName(R.p,'pdf'),save); }

    await kfRepShare(blob,kfRepName(R.p,'png'),save); }

/* lebih dari 1 halaman → foto disusun ke bawah jadi 1 gambar */
function kfRepStack(pages){ if(pages.length===1) return pages[0]; const gap=24, w=pages[0].width, h=pages.reduce((a,c)=>a+c.height,0)+gap*(pages.length-1);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d'); g.fillStyle='#d5dae1'; g.fillRect(0,0,w,h);
  let y=0; pages.forEach(c=>{ g.drawImage(c,0,y); y+=c.height+gap; }); return cv; }

  const o=document.createElement('div'); o.className='kf-rpzm'; o.innerHTML='<button type="button" class="kf-rpzx" aria-label="Tutup">✕</button><div class="kf-rpzs"></div>';
  const s=o.querySelector('.kf-rpzs'); R.pages.forEach(cv=>{ const im=new Image(); im.alt='Halaman laporan'; im.src=cv.toDataURL('image/jpeg',0.92); s.appendChild(im); });

/* PDF minimal: 1 gambar JPEG per halaman A4 landscape (tanpa library) */
function kfPdfStr(s){ const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i)&255; return b; }
function kfPdfB64(s){ const bin=atob(s), b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function kfPdfBlob(pages){ const parts=[], offs=[]; let len=0;
  const put=x=>{ const b=(typeof x==='string')?kfPdfStr(x):x; parts.push(b); len+=b.length; };
  const obj=s=>{ offs.push(len); put(offs.length+' 0 obj\n'+s+'\nendobj\n'); };
  const PW='841.89', PH='595.28', N=pages.length, kids=[];
  for(let i=0;i<N;i++) kids.push((3+i*3)+' 0 R');
  put('%PDF-1.4\n%âãÏÓ\n');
  obj('<< /Type /Catalog /Pages 2 0 R >>');
  obj('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  pages.forEach((cv,i)=>{ const pn=3+i*3, cn=pn+1, im=pn+2, cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im'+i+' Do Q';
    obj('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im'+i+' '+im+' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents '+cn+' 0 R >>');
    obj('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    const jb=kfPdfB64(cv.toDataURL('image/jpeg',0.92).split(',')[1]);
    offs.push(len); put(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jb.length+' >>\nstream\n'); put(jb); put('\nendstream\nendobj\n'); });
  const xo=len, n=offs.length+1;
  put('xref\n0 '+n+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+n+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'}); }

/* ----- data laporan dari plan + p.conf + ceklist (yang kosong dibuang) ----- */
function kfRpCl(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function kfRepData(p){ const c=p.conf||{}, tunda=!!(p.postponed||c.st==='tunda'), ck=kfCkOf(p), P=kfPlanOf(p), cl=kfRpCl;
  const D={mc:cl(p.machine||p.line)||'—', title:'VERIFIKASI PENGECEKAN JOB CHANGE', sub:'IS Machine · Rekap plan vs aktual + ceklist tekanan after JC', tunda, why:cl(c.note), trial:!!p.trial,
    groups:[], nS:0, nG:0, add:[], ck:null, bad:[], temu:[], mp:[]};
  if(c.at){ const d=new Date(c.at), H3=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    D.when=(tunda?'Ditunda: ':'Diverifikasi: ')+H3[d.getDay()]+', '+fmtD(d)+' · '+kfWaJam(c.at); }
  const nd=tunda?0:kfDiff(p).filter(x=>x.k!=='mp').length;
  D.chip=tunda?{t:'DITUNDA',c:'#c0262f',bg:'#fff0f0',bd:'#f6c4c4'}
    :c.st==='berubah'?{t:'ADA PERUBAHAN'+(nd?' · '+nd+' BEDA DARI PLAN':''),c:'#1e63c4',bg:'#e6efff',bd:'#c7dafc'}
    :{t:'SESUAI PLAN',c:'#14684e',bg:'#e3f6ee',bd:'#bfe8d6'};
  const sh=kfWaShift(p.shift), psh=kfWaShift(P.shift), cd=cl(p.cd||(ck&&ck.cd)), wt=cl(p.weight||(ck&&ck.weight));
  D.info=[[tunda?'Ditandai oleh':'Diverifikasi oleh',cl(c.by),1],['Line / Mesin',D.mc],['Job / Type',p.typeJob?'#'+cl(p.typeJob)+(p.trial?' (trial)':''):''],['Tanggal Job Change',p.jcDate?kfWaHari(parseD(p.jcDate)):''],
    ['Shift',sh?sh+(!tunda&&psh&&psh!==sh?' (plan: '+psh+')':''):''],['Produk',cl(p.description||p.bottleSize),1],
    ['Proses · CD',[cl(p.process),cd?'CD '+cd:''].filter(Boolean).join(' · ')],['Berat',wt?(/[a-z]/i.test(wt)?wt:wt+' gr'):''],
    ['Machine speed',tunda?'':cl(c.speed)],['Shear cut',tunda?'':cl(c.shear)]].filter(f=>f[1]);
  if(tunda) return kfRepFoot(D,p);
  /* rekap plan: hanya baris yang dipilih Sama / Ganti */
  const E=kfMkEdit(p), AS=p.specs||{};
  E.groups.forEach(gp=>{ const it=[];
    gp.idx.forEach(i=>{ const r=E.rows[i];
      if(r.t==='s'){ const x=E.chk[r.part]; if(!x||!x.st) return; const pv=kfSpecTxt(r.pv), av=kfSpecTxt(AS[r.part]), df=x.st==='ganti'&&jcfKey(pv)!==jcfKey(av);
        it.push({n:r.part,pl:pv,strike:df&&!!pv,st:x.st,act:df?(av||'dilepas'):'',ket:cl(x.ket)}); }
      else { const o=E.ro[r.i]; if(!o||!o.st) return; const a=o.ns?'non-section':(kfSecTxt(o.ps)||'—'), b=kfSecTxt(o.sections), df=o.st==='ganti'&&!o.ns&&a!==(b||'—');
        it.push({n:o.part,pl:a,strike:df,st:o.st,act:df?(b||'tidak dikerjakan'):'',ket:cl(o.ket)}); } });
    if(it.length) D.groups.push({a:gp.ro?'ROASTER PLAN':String(gp.area||'').toUpperCase(),it}); });
  D.groups.forEach(gp=>gp.it.forEach(x=>{ if(x.st==='ganti') D.nG++; else D.nS++; }));
  D.add=(E.add||[]).filter(a=>a&&a.part).map(a=>({n:cl(a.part),s:a.ns?'non-section':kfSecTxt(a.sections),k:cl(a.ket)}));
  /* ceklist tekanan: jenis / section tanpa isian tidak ditampilkan */
  if(ck){ const has=v=>v!==''&&v!=null, sec=ck.sec||{}, cols=jccCols(ck.cd||cd), cell=(s,t)=>((sec[s]||{})[t]||{});
    const secs=sectionsOf(p.machine||p.line||ck.machine).concat(Object.keys(sec)).filter((s,i,a)=>a.indexOf(s)===i);
    const T=JCC_PT.filter(([t])=>secs.some(s=>cols.some(k=>has(cell(s,t)[k])||cell(s,t)[k+'Bad'])));
    const rows=secs.filter(s=>T.some(([t])=>cols.some(k=>has(cell(s,t)[k])||cell(s,t)[k+'Bad'])))
      .map(s=>({s,v:T.map(([t])=>cols.map(k=>{ const x=cell(s,t); return {v:has(x[k])?jccDisp(x[k]):'',bad:!!x[k+'Bad']}; }))}));

/* normalisasi teks untuk pencocokan */


/*
 * Normalisasi ukuran inch:
 *   1.375  -> 1 3/8
 *   1.125  -> 1 1/8
 *   0.375  -> 3/8
 *   1 3/8  -> tetap 1 3/8
 * Hanya pecahan dengan penyebut umum 2/4/8/16/32 yang diubah.
 * Angka yang tidak pas dengan pecahan tersebut dibiarkan apa adanya.
 */
function jcmFraction(v){
  if(v==null)return '';
  let s=String(v).replace(/\u00A0/g,' ').trim();
  if(!s)return '';
  s=s.replace(/,/g,'.').replace(/\s+/g,' ');
  if(/[\/]/.test(s)) return s;                 // sudah fraction/mixed fraction
  const n=Number(s);
  if(!Number.isFinite(n)) return s;
  const whole=n<0?Math.ceil(n):Math.floor(n);
  const frac=Math.abs(n-whole);
  if(frac<1e-9)return String(whole);
  const dens=[2,4,8,16,32];
  let best=null;
  dens.forEach(d=>{
    const num=Math.round(frac*d), err=Math.abs(frac-num/d);
    if(num>0 && num<d && (!best || err<best.err)) best={num:num,den:d,err:err};
  });
  if(!best || best.err>0.00001)return s;
  /* sederhanakan */
  let a=best.num,b=best.den;
  while(b){ const t=a%b; a=b; b=t; }
  const num=best.num/a, den=best.den/a;
  const sign=n<0?'-':'';

// Reconcile DB roaster records to match an APPLIED plan (handles add / remove / machine&date change)
function syncRoasterPlan(plan){
  if(!plan||!plan.roasterApplied) return {added:0,removed:0};
  const machine=plan.machine||plan.line, date=plan.jcDate, shift=plan.shift||'';
  const desired=new Set();
  (plan.roasterPlan||[]).forEach(r=>(r.sections||[]).forEach(s=>desired.add(s+'\u0001'+r.part)));
  let added=0,removed=0;
  // adopt legacy untagged roaster records that match this plan (so we can manage them)
  DB.forEach(r=>{ if(r._jc==null && r.reason==='Roaster' && r.machine===machine && r.date===date && desired.has(r.section+'\u0001'+r.part)) r._jc=plan.id; });
  // remove records owned by this plan that are no longer desired (covers removed rows & machine/date edits)
  for(let i=DB.length-1;i>=0;i--){ const r=DB[i];
    if(r._jc===plan.id && !(r.machine===machine && r.date===date && desired.has(r.section+'\u0001'+r.part))){ DB.splice(i,1); removed++; } }
  // add desired records that don't exist yet
  desired.forEach(k=>{ const idx=k.indexOf('\u0001'); const section=k.slice(0,idx), part=k.slice(idx+1);
    const ex=DB.find(x=>x.machine===machine&&x.section===section&&x.part===part&&x.date===date);
    if(ex){ if(ex.reason==='Roaster'&&ex._jc==null) ex._jc=plan.id; }   // adopt matching, leave manual records untouched
    else { DB.push({id:newRecId(),date,machine,section,part,reason:'Roaster',pic:shift,_jc:plan.id}); added++; } });
  return {added,removed};
}

function jcVarChanges(plan){

  return {prev, list: transitionDiff(prev,plan).filter(d=>d.status==='change'||d.status==='add')};
}

/* Samakan record di DB dengan pilihan pada plan (tambah / hapus saat dicentang-ulang) */
function syncJCVarPlan(plan){
  if(!plan||!plan.varApplied) return {added:0,removed:0};
  const machine=plan.machine||plan.line, date=plan.jcDate, shift=(plan.shift||'');
  const secs=jcVarSecs(plan), picks=jcVarPicked(plan);
  const desired=new Set();
  picks.forEach(d=>{
    if(jcVarPerSec(d)) secs.forEach(sc=>desired.add(sc+'\u0001'+d.part));
    else desired.add(JCVAR_NOSEC+'\u0001'+d.part);          // feeder / ware handling: satu record saja
  });
  let added=0,removed=0;
  for(let i=DB.length-1;i>=0;i--){ const r=DB[i];
    if(r._jcv===plan.id && !(r.machine===machine && r.date===date && desired.has(r.section+'\u0001'+r.part))){ DB.splice(i,1); removed++; } }
  desired.forEach(k=>{ const ix=k.indexOf('\u0001'); const section=k.slice(0,ix), part=k.slice(ix+1);
    const ex=DB.find(x=>x.machine===machine&&x.section===section&&x.part===part&&x.date===date);
    if(ex){ if(ex._jcv==null&&ex._jc==null) ex._jcv=plan.id; }   // pakai yang sudah ada, jangan dobel
    else { DB.push({id:newRecId(),date,machine,section,part,reason:part,pic:shift,_jcv:plan.id}); added++; }
    rgRegisterJC(part); });
  return {added,removed};
}

const JCC_PT=[['pu','Plunger Up'],['cb','Counter Blow'],['vb','Vertiblow']];
const JCC_GP=[['hp','High Pressure'],['lp','Low Pressure'],['sb','Settle Blow'],['fb','Final Blow'],['fcg','Finish Cooling'],['moc','Pressure MOC'],
  ['blw','Blower Pressure'],['vac','Vacuum / Cool Bottom'],['hecs','HEC Stroke Pump'],['hecc','HEC Hasil CTU'],['dfe','DFE Pressure']];
/* skala isian: tekanan bar 0–5 langkah 0,1 (default) · operation check punya satuan & rentang sendiri */
const JCC_BAR={min:0,max:5,step:0.1,dec:1,unit:'bar',seed:2,short:1};
const JCC_GS={blw:{min:0,max:300,step:1,dec:0,unit:'mBar',seed:80},vac:{min:-1,max:5,step:0.1,dec:1,unit:'bar',seed:0.5},
  hecs:{min:0,max:100,step:1,dec:0,unit:'stroke',seed:30},hecc:{min:0,max:100,step:1,dec:0,unit:'CTU',seed:45},dfe:{min:0,max:150,step:1,dec:0,unit:'psi',seed:60}};
function jccSc(t){ return (t&&t.kind==='g'&&JCC_GS[t.a])||JCC_BAR; }
function jccScN(sc){ return Math.round((sc.max-sc.min)/sc.step); }
function jccUnitX(k){ const g=JCC_GS[k]; return g&&g.unit!=='bar'?g.unit:''; }   /* satuan selain bar (untuk teks / laporan) */
function jccHasTengah(cd){ return /(^|[^0-9])4\s*(¼|1\/4|[.,]25)/.test(String(cd||'')); }   /* CD 4¼" (triple gob) → 3 per section: Luar · Tengah · Dalam */
function jccCols(cd){ return jccHasTengah(cd)?['l','m','d']:['l','d']; }
function jccColLabel(c){ return c==='l'?'Luar':c==='m'?'Tengah':'Dalam'; }
function jccGetCell(type,sec){ const e=window._jccEdit; e.sec=e.sec||{}; e.sec[sec]=e.sec[sec]||{}; e.sec[sec][type]=e.sec[sec][type]||{}; return e.sec[sec][type]; }
function jccSetP(type,sec,col,val){ const c=jccGetCell(type,sec); c[col]=val; if(c.eq) delete c.eq; }
function jccBuzz(ms){ try{ if(navigator&&navigator.vibrate) navigator.vibrate(ms||10); }catch(e){} }
function jccGetG(key){ const e=window._jccEdit; e.glob=e.glob||{}; e.glob[key]=e.glob[key]||{v:'',bad:false}; return e.glob[key]; }

/* ============ AUDIT TRAIL ============
   Mencatat siapa mengubah apa, kapan, dari nilai berapa ke berapa.
   Disimpan terpisah di key `pm_audit` dan dibatasi jumlahnya supaya
   tidak ikut membengkakkan penyimpanan. */
const AUDIT_MAX_DEFAULT=500;



const AUDIT_KEYS={
  record:['date','machine','section','part','reason','pic'],
  stock:['part','size','qty','unit','location','note'],
  jcplan:['machine','jcDate','shift','process','cd','typeJob','description','weight','diameter','trial','postponed','notes'],
  jccheck:['date','machine','typeJob','cd','process','weight','perbaikan','variabel','notes']
};
function auditMax(){ const n=parseInt(CFG.auditMax,10); return (isFinite(n)&&n>=50)?n:AUDIT_MAX_DEFAULT; }
function auditWho(){ return curUser(); }

function auditPick(o,keys){ const out={}; if(!o)return out;
  keys.forEach(k=>{ const v=o[k]; if(v!==undefined&&v!==null&&v!=='') out[k]=(typeof v==='boolean')?(v?'ya':'tidak'):v; });
  return out; }
function auditSnap(ent,o){ const out=auditPick(o,AUDIT_KEYS[ent]||[]);
  /* plan JC: man power & jam kerja aktual per area ikut tercatat di log */
  if(ent==='jcplan'&&o){ try{ const mp=o.manpower||{}, hr=o.mpHours||{};
    jcfMpGroups().forEach(g=>{ const n=mpSplit(mp[g.key]).join(', '); if(n) out['MP '+g.label]=n; if(+hr[g.key]>0) out['Jam '+g.label]=+hr[g.key]; }); }catch(e){} }
  return out; }
/* snapshot ceklist JC = header + seluruh titik tekanan (di-flat) */
function auditJccSnap(r){ const out=auditSnap('jccheck',r);
  try{ const f=jccFlatPoints(r); Object.keys(f).forEach(k=>{ out['⚙ '+f[k].label]=f[k].v; }); }catch(e){}
  return out; }
function auditDiff(b,a){ const out={}; const seen={};
  [b||{},a||{}].forEach(o=>Object.keys(o).forEach(k=>{seen[k]=1;}));
  Object.keys(seen).forEach(k=>{ const x=(b&&b[k]!==undefined)?b[k]:''; const y=(a&&a[k]!==undefined)?a[k]:'';
    if(String(x)!==String(y)) out[k]=[x,y]; });
  return out; }
function auditLog(act,ent,ref,before,after,note){
  try{
    if(!Array.isArray(AUDIT)) AUDIT=[];
    if(act==='edit'){ const d=auditDiff(before,after); if(!Object.keys(d).length) return; }
    AUDIT.push({ id:Date.now()+'-'+Math.random().toString(36).slice(2,7), ts:Date.now(),
      user:auditWho(), act:act, ent:ent, ref:String(ref||''),
      before:before||null, after:after||null, note:note||'' });
    const mx=auditMax(); if(AUDIT.length>mx) AUDIT.splice(0,AUDIT.length-mx);
  }catch(e){}
}










/* ============ ANOMALI PRESSURE ============
   Membandingkan tekanan pada ceklist terakhir terhadap median historis
   titik yang sama di mesin tersebut. Menyimpang ≥ ambang → ditandai. */
function jccDevPct(){ const n=parseFloat(CFG.jccDevPct); return (isFinite(n)&&n>0)?n:10; }
function jccMinN(){ const n=parseInt(CFG.jccMinN,10); return (isFinite(n)&&n>=2)?n:3; }
function jccLinkDays(){ const n=parseInt(CFG.jccLinkDays,10); return (isFinite(n)&&n>0)?n:21; }
function jccMedian(a){ if(!a||!a.length)return null; const s=a.slice().sort((x,y)=>x-y); const m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function jccKeySec(k){ const p=String(k).split('|'); return p[0]==='p'?(p[2]||''):''; }
/* median tiap titik dari ceklist SEBELUM `target` */
function jccBaseline(machine,target){
  const list=jccForMachine(machine);
  let cut=list.length;
  if(target){ const i=list.findIndex(r=>r.id===target.id); if(i>=0) cut=i; }
  const acc={};
  list.slice(0,cut).forEach(r=>{ const f=jccFlatPoints(r);
    Object.keys(f).forEach(k=>{ (acc[k]=acc[k]||{vals:[],label:f[k].label}).vals.push(f[k].v); }); });
  const out={}; Object.keys(acc).forEach(k=>{ out[k]={med:jccMedian(acc[k].vals),n:acc[k].vals.length,label:acc[k].label}; });
  return out;
}
function jccAnomalies(machine,rec){
  const list=jccForMachine(machine);
  if(!list.length) return {rows:[],rec:null,base:{},covered:0,total:0};
  const target=rec||list[list.length-1];
  const base=jccBaseline(machine,target), f=jccFlatPoints(target);
  const lim=jccDevPct(), minN=jccMinN(), rows=[];
  let covered=0;
  Object.keys(f).forEach(k=>{
    const b=base[k]; if(!b||b.n<minN||!b.med) return;
    covered++;
    const d=f[k].v-b.med, pct=(d/b.med)*100;
    if(Math.abs(pct)>=lim) rows.push({key:k,label:f[k].label,v:f[k].v,med:b.med,n:b.n,
      d:+d.toFixed(2),pct:+pct.toFixed(1),bad:!!f[k].bad,sec:jccKeySec(k)});
  });
  rows.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
  return {rows:rows,rec:target,base:base,covered:covered,total:Object.keys(f).length};

/* penggantian part di section yang sama, dalam N hari setelah ceklist */
function jccLinkedFailures(machine,sec,fromDate,days){
  if(!machine||!sec||!fromDate) return [];
  let d0; try{ d0=parseD(fromDate); }catch(e){ return []; }
  const win=days||jccLinkDays(), acc={};
  (DB||[]).forEach(r=>{
    if(r.machine!==machine||r.section!==sec||!r.date) return;
    let dd; try{ dd=daysBetween(d0,parseD(r.date)); }catch(e){ return; }
    if(dd<0||dd>win) return;
    const k=r.part||'-'; (acc[k]=acc[k]||{part:k,n:0,last:r.date}).n++;
    if(r.date>acc[k].last) acc[k].last=r.date;
  });
  return Object.values(acc).sort((a,b)=>b.n-a.n);

<script>
/* ============ TWEAKS — expressive controls that reshape the whole dashboard's feel ============ */
(function(){
  const TW_ACCENTS={amber:['#f5a623','#ffc14d'],blue:['#4f9dff','#86bcff'],teal:['#1fb6b8','#54e3e5'],violet:['#8b7bf0','#b3a6ff']};
  const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
    "accent": "amber",
    "mood": "deep",
    "density": "dense"
  }/*EDITMODE-END*/;
  let TW=Object.assign({},TWEAK_DEFAULTS);
  try{const s=localStorage.getItem('pm_tweaks'); if(s)TW=Object.assign(TW,JSON.parse(s)||{});}catch(e){}
  function apply(){
    const acc=TW_ACCENTS[TW.accent]||TW_ACCENTS.amber, r=document.documentElement.style;
    r.setProperty('--accent',acc[0]); r.setProperty('--accent2',acc[1]);
    const b=document.body; if(!b)return;
    b.classList.toggle('tw-flat',TW.mood==='flat');
    b.classList.toggle('tw-contrast',TW.mood==='contrast');
    b.classList.toggle('tw-dense',TW.density==='dense');
  }
  function save(){ try{localStorage.setItem('pm_tweaks',JSON.stringify(TW));}catch(e){} }
  function build(){
    const p=document.getElementById('twPanel'); if(!p)return;
    const sw=Object.keys(TW_ACCENTS).map(k=>`<div class="tw-swatch${TW.accent===k?' on':''}" style="background:${TW_ACCENTS[k][0]}" title="${k}" onclick="__tw('accent','${k}')"></div>`).join('');
    const seg=(key,opts)=>`<div class="tw-seg">${opts.map(o=>`<button class="${TW[key]===o[0]?'on':''}" onclick="__tw('${key}','${o[0]}')">${o[1]}</button>`).join('')}</div>`;
    p.querySelector('.tw-body').innerHTML=
      '<div class="tw-sec"><span class="tw-lbl">Signature Color</span><div class="tw-sw">'+sw+'</div></div>'+
      '<div class="tw-sec"><span class="tw-lbl">Surface Mood</span>'+seg('mood',[['deep','Deep'],['flat','Flat'],['contrast','Kontras']])+'</div>'+
      '<div class="tw-sec"><span class="tw-lbl">Display Density</span>'+seg('density',[['cozy','Lega'],['dense','Padat']])+'</div>';
  }
  window.__tw=function(k,v){ TW[k]=v; apply(); save(); build();
    try{window.parent.postMessage({type:'__edit_mode_set_keys',edits:{[k]:v}},'*');}catch(e){} };
  function show(on){ const p=document.getElementById('twPanel'); if(p)p.classList.toggle('show',!!on); }
  function init(){
    if(document.getElementById('twPanel')) return;
    const el=document.createElement('div'); el.id='twPanel';
    el.innerHTML='<div class="tw-h"><span class="tw-dot"></span><b>Tweaks</b><button class="tw-x" onclick="window.__twClose()">✕</button></div><div class="tw-body"></div><div class="tw-foot">Mengubah nuansa tampilan — warna khas, gaya permukaan, dan kepadatan info. Tersimpan otomatis.</div>';
    document.body.appendChild(el);
    window.__twClose=function(){ show(false); try{window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}catch(e){} };
    window.addEventListener('message',function(e){ const t=e&&e.data&&e.data.type;
      if(t==='__activate_edit_mode'){ build(); show(true); } else if(t==='__deactivate_edit_mode'){ show(false); } });
    try{window.parent.postMessage({type:'__edit_mode_available'},'*');}catch(e){}
    apply(); build();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
