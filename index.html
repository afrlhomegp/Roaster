<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RAB Renovasi Lantai 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: aplikasi saku estimator — satu kolom, daftar baris (label kiri, isian kanan), navigasi bawah di HP */
:root{
  --bg:#F1F2F3; --surface:#FFFFFF; --ink:#1A2027; --muted:#646E79; --line:#E1E4E8; --line-2:#CDD2D8;
  --accent:#1D5BA6; --accent-ink:#FFFFFF; --accent-soft:#E4ECF7;
  --field:#F6F7F9;
  --ok:#1C7646; --ok-bg:#DCF1E4; --warn:#9A5400; --warn-bg:#FBEBD2; --bad:#B42318; --bad-bg:#FAE0DC; --na:#7A828C; --na-bg:#ECEEF0;
  --bar:#1D5BA6; --bar-track:#E6E9ED;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101418; --surface:#181E25; --ink:#E5E9ED; --muted:#9AA4AF; --line:#262E37; --line-2:#36404B;
  --accent:#72A9EE; --accent-ink:#0C1622; --accent-soft:#1B2B40; --field:#1F262E;
  --ok:#62CF92; --ok-bg:#163024; --warn:#EFA85A; --warn-bg:#352612; --bad:#F2887D; --bad-bg:#3A1C19; --na:#98A0A9; --na-bg:#242A31;
  --bar:#72A9EE; --bar-track:#28303A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101418; --surface:#181E25; --ink:#E5E9ED; --muted:#9AA4AF; --line:#262E37; --line-2:#36404B;
  --accent:#72A9EE; --accent-ink:#0C1622; --accent-soft:#1B2B40; --field:#1F262E;
  --ok:#62CF92; --ok-bg:#163024; --warn:#EFA85A; --warn-bg:#352612; --bad:#F2887D; --bad-bg:#3A1C19; --na:#98A0A9; --na-bg:#242A31;
  --bar:#72A9EE; --bar-track:#28303A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.2rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small,.small{font-size:.84rem}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{flex:1 1 auto;min-width:0}
.brand h1{font-size:1.3rem;line-height:1.1}
.brand .sub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn[disabled]{cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--field)}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:.9rem}

/* nav */
.nav{display:flex}
.nav button{flex:1;border:0;background:none;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font:600 .74rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font:600 .65rem/16px var(--f-mono)}
@media (max-width:719px){
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
  main{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))!important}
  #toast{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px))!important}
}
@media (min-width:720px){
  .nav{max-width:760px;margin:0 auto;padding-inline:16px;gap:4px}
  .nav button{flex:0 0 auto;flex-direction:row;gap:6px;padding:10px 12px;font-size:.85rem;border-bottom:3px solid transparent}
  .nav button svg{width:18px;height:18px}
  .nav button[aria-current="page"]{border-bottom-color:var(--accent)}
  .nav .badge{position:static}
}

main{padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
#banner:empty{display:none}
#banner{margin-top:12px}
.note{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.warnbox{background:var(--bad-bg);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.warnbox b{color:var(--bad)}

/* hero */
.hero{background:var(--surface);border-radius:var(--r);padding:18px 18px 16px;border:1px solid var(--line)}
.hero .k{font:600 .78rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero .v{font:600 clamp(1.8rem,8vw,2.4rem)/1.1 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.hero .s{color:var(--muted);margin-top:4px}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hero-grid div{min-width:0}
.hero-grid span{display:block;font-size:.78rem;color:var(--muted)}
.hero-grid b{display:block;font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* section + list */
.sec{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 6px}
.sec-h p{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.sec-b{padding:4px 16px 14px}
.list > *{border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:52px}
.row-l{min-width:0;flex:1 1 auto}
.row-l label,.row-l .t{display:block;font-weight:500;line-height:1.25}
.row-l small{display:block;color:var(--muted);margin-top:2px}
.row-r{display:flex;align-items:center;gap:8px;flex:none}
.row.stack{flex-direction:column;align-items:stretch;gap:6px}
.row.stack .row-r{flex:1 1 auto}
.row.stack .row-r .inp{flex:1}
.inp{display:inline-flex;align-items:center;background:var(--field);border:1px solid var(--line-2);border-radius:8px;padding:0 10px;min-height:40px}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp input{border:0;background:none;outline:none;color:var(--ink);font:inherit;width:100%;min-width:0;padding:8px 0}
.inp.n input{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;width:6.5em}
.inp.rp input{width:8.5em}
.inp .u{font-size:.82rem;color:var(--muted);padding-left:6px;white-space:nowrap}
.inp .pre{font-size:.82rem;color:var(--muted);padding-right:6px}
select{border:1px solid var(--line-2);background:var(--field);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;min-height:40px;max-width:100%}
.ck{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-2);background:none;display:grid;place-items:center;cursor:pointer;color:transparent;flex:none}
.ck svg{width:16px;height:16px}
.ck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sw{width:48px;height:28px;border-radius:14px;border:0;background:var(--line-2);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{left:23px}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.full{display:flex}
.seg.full button{flex:1}
.calc{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--field);font-size:.92rem}
.calc b{font-family:var(--f-mono);font-weight:600}

/* details */
details.more > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-weight:600;color:var(--accent)}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;margin-right:4px}
details.more[open] > summary::after{transform:rotate(-135deg)}

/* dot status */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--na);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font:700 .78rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--na-bg);color:var(--na);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}

/* steps */
.step{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.step:hover{background:var(--field)}
.step .ix{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 .82rem var(--f-mono);flex:none;background:var(--warn-bg);color:var(--warn)}
.step .ix.bad{background:var(--bad-bg);color:var(--bad)}
.step .tx{flex:1;min-width:0}
.step .tx small{display:block;color:var(--muted)}
.step .go{color:var(--muted);flex:none}

/* bars */
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 16px}
.brow .lb{min-width:0}
.brow .vv{text-align:right;font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .bar{grid-column:1 / -1;height:6px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--bar);border-radius:3px}
.brow .pc{color:var(--muted);font-weight:500;margin-left:6px}

/* item rows */
details.grp > summary{list-style:none;cursor:pointer}
details.grp > summary::-webkit-details-marker{display:none}
.grp-s{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:4px 12px;align-items:center;padding:12px 16px}
.grp-s .nm{font-weight:600}
.grp-s .vv{font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.grp-s .cv{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.grp[open] .grp-s .cv{transform:rotate(45deg)}
.grp-s .bar{grid-column:1 / 3;height:4px;background:var(--bar-track);border-radius:2px;overflow:hidden}
.grp-s .bar i{display:block;height:100%;background:var(--bar)}
.items{border-top:1px solid var(--line);background:var(--field)}
details.it{border-top:1px solid var(--line)}
details.it:first-child{border-top:0}
details.it > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:10px 16px}
details.it > summary::-webkit-details-marker{display:none}
details.it .dot{transform:translateY(-1px)}
details.it .nm{min-width:0;overflow-wrap:anywhere}
details.it .vv{font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
details.it .sb{grid-column:2 / 4;font-size:.82rem;color:var(--muted);font-family:var(--f-mono)}
.it-body{padding:2px 12px 14px 16px;font-size:.88rem;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.kv b{font-family:var(--f-mono);font-weight:600;text-align:right}
.mini{width:100%;border-collapse:collapse;font-size:.84rem}
.mini td{padding:5px 0;border-top:1px dashed var(--line-2);vertical-align:top}
.mini td.r{text-align:right;font-family:var(--f-mono);white-space:nowrap;padding-left:10px}
.stat{font-size:.84rem;padding:8px 10px;border-radius:8px;background:var(--surface)}

/* bukaan */
.bk{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.bk-h{display:flex;gap:8px;align-items:center}
.bk-h select{flex:1;min-width:0}
.bk-dim{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,.8fr);align-items:center;gap:6px}
.bk-dim .x{color:var(--muted)}
.bk-dim .inp{padding:0 8px;min-width:0}
.bk-dim .inp.n input{width:100%}
.bk-dim .res{grid-column:1 / -1;text-align:right;font:600 .9rem var(--f-mono);white-space:nowrap}
.bk details summary{font-size:.85rem;color:var(--accent);cursor:pointer}
.bk-adv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.bk-adv label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px}
.bk-adv select,.bk-adv .inp{width:100%}

/* cek */
.kn{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.kn-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kn-h .t{font-weight:600;min-width:0}
.kn .h{font-size:.84rem;color:var(--muted)}
.kn .w{font-size:.84rem;color:var(--bad);font-weight:600}
.st{border-radius:999px;font-weight:700;font-size:.8rem;padding:6px 10px;min-height:34px;flex:none}
.st.s-SELESAI{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.st.s-PERLU{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.st.s-BELUM{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.st.s-NA{background:var(--na-bg);color:var(--na);border-color:transparent}
.progress{height:8px;background:var(--bar-track);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}

/* menu */
.menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:16px;z-index:40;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.18);min-width:250px;max-width:calc(100vw - 32px);overflow:hidden}
.menu button.mi{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 16px;cursor:pointer;border-top:1px solid var(--line)}
.menu button.mi:first-child{border-top:0}
.menu button.mi:hover{background:var(--field)}
.menu button.mi small{display:block;color:var(--muted)}
.menu .confirm{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--warn-bg)}
.menu .confirm div{display:flex;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center}
#toast.show{opacity:1}
.foot{font-size:.82rem;color:var(--muted);text-align:center;padding-inline:8px}


/* edit */
.tag{display:inline-block;font:700 .64rem/1.5 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);vertical-align:2px;margin-left:4px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--field);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;margin:4px 6px 0 0;color:var(--ink)}
.chip b{color:var(--accent)}
.btn.sm{min-height:34px;padding:6px 14px;font-size:.86rem}
.btn.danger{color:var(--bad);background:none}
.btn.danger:hover{background:var(--bad-bg)}
.icon-btn.sm{width:36px;height:36px;color:var(--muted);flex:none}
.icon-btn.sm:hover{color:var(--bad);background:var(--bad-bg)}
.act-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.ed-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.ed-l{flex:1 1 180px;min-width:0}
.ed-l label{font-weight:600;display:block}
.ed-l small{display:block;color:var(--muted)}
.cmp{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);overflow:hidden}
.cmp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-weight:600;font-size:.86rem}
.cmp-note{padding:6px 10px 8px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line-2)}
.cmp-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 4px 8px 10px;border-top:1px dashed var(--line-2)}
.cmp-r .cn{grid-column:1;grid-row:1;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.cmp-r .cn small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.75rem;margin-top:2px}
.cmp-r .icon-btn{grid-column:2;grid-row:1}
.cmp-r .inp{grid-column:1;grid-row:2;justify-self:start;min-height:36px;padding:0 8px}
.cmp-r .inp.n input{width:5.5em;padding:6px 0}
.cmp-r .ln{grid-column:2;grid-row:2;text-align:right;font:600 .84rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:6px}
.cmp-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px 10px;border-top:1px dashed var(--line-2);background:var(--field)}
.cmp-add select{grid-column:1 / -1;min-height:36px;padding:6px 8px;font-size:.86rem;min-width:0;width:100%}
.cmp-add .inp{min-height:36px;padding:0 8px;justify-self:start}
.cmp-add .inp.n input{width:5em;padding:6px 0}
.cmp-tot{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--line-2);font-weight:700}
.cmp-tot b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cust-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.cust-f label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px}
.cust-f .inp,.cust-f select{width:100%}
.cust-f .inp.n input,.cust-f .inp.rp input{width:100%}
.cust-f .w2{grid-column:1 / -1}

function mergeState(base, inc){
  if(!inc || typeof inc!=='object') return base;
  const out = base;
  for(const k of Object.keys(inc)){
    const v = inc[k];
    if(k==='bk'){ if(Array.isArray(v)) out.bk = v.map(b=>({...b})); continue; }
    if(v && typeof v==='object' && !Array.isArray(v) && out[k] && typeof out[k]==='object' && !Array.isArray(out[k])) out[k] = mergeState(out[k], v);
    else out[k] = Array.isArray(v) ? v.slice() : v;
  }

}

function render(keep){
  let id=null, ss=null, se=null;
  if(keep){ const a=document.activeElement; if(a && a.id && app.contains(a)){ id=a.id; try{ss=a.selectionStart; se=a.selectionEnd;}catch(e){} } }
  const y = window.scrollY;
  app.innerHTML = VIEWS[tab]();
  updateTop();
  if(id){ const el=document.getElementById(id); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} } }
  if(keep) window.scrollTo(0,y);
}

let draftT=null;

function applyInput(el){

});

});

  else if(a==='compAdd'){ const code=b.dataset.a, sx=b.dataset.it, sel=document.getElementById('add-'+sx), kin=document.getElementById('addk-'+sx);

    if(!rc){ toast('Pilih material, upah, atau alat dulu.'); if(sel) sel.focus(); return; }
    if(k==null || k<=0){ toast('Isi koefisien: jumlah per 1 satuan pekerjaan.'); if(kin) kin.focus(); return; }
    if(R.A[code].comps.some(c=>c.rc===rc)){ toast('Komponen itu sudah ada. Ubah koefisiennya saja.'); return; }
    edit(()=>{ const ce=compOf(code); if((ce.rm||[]).includes(rc)){ ce.rm=ce.rm.filter(x=>x!==rc); ce.kf=ce.kf||{}; ce.kf[rc]=k; } else { ce.add=ce.add||[]; ce.add.push([rc,k]); } }, 'Komponen ditambahkan.'); }
  else if(a==='matRm'){ const rc=b.dataset.rc, nm=R.H[rc]?R.H[rc].r.u:rc; edit(()=>{ for(const code in DATA.ANA){ if(DATA.ANA[code].comps.some(c=>c[0]===rc)){ const ce=compOf(code); ce.rm=(ce.rm||[]).filter(x=>x!==rc).concat(rc); if(ce.kf) delete ce.kf[rc]; } const ce=S.comp[code]; if(ce && ce.add) ce.add=ce.add.filter(x=>x && x[0]!==rc); } }, nm+' dihapus dari semua pekerjaan.', true); }
  else if(a==='matRestore'){ const rc=b.dataset.rc; edit(()=>{ for(const code in S.comp){ const ce=S.comp[code]; if(ce && ce.rm) ce.rm=ce.rm.filter(x=>x!==rc); } }, 'Komponen dikembalikan.'); }
  else if(a==='resAdd'){ const n=1+Math.max(0,...S.resx.map(x=>parseInt(String(x.c).slice(1),10)||0)); S.resx.push({c:'X'+String(n).padStart(2,'0'), t:'M', u:'', sat:'', h:null, w:null}); markDirty(); recompute(); render(true); focusNew(fid('resx.'+(S.resx.length-1)+'.u')); }
  else if(a==='resDel'){ const j=+b.dataset.j; edit(()=>{ const c=S.resx[j].c; S.resx.splice(j,1); for(const code in S.comp){ const ce=S.comp[code]; if(ce && ce.add) ce.add=ce.add.filter(x=>x && x[0]!==c); } }, 'Item harga dihapus.', true); }
  else if(a==='konAdd'){ S.konx.push({u:'', kr:false, st:'BELUM', pic:'', tgl:'', ket:''}); markDirty(); recompute(); render(true); focusNew(fid('konx.'+(S.konx.length-1)+'.u')); }
  else if(a==='konDel'){ const j=+b.dataset.j; edit(()=>{ S.konx.splice(j,1); }, 'Item cek dihapus.', true); }
  else if(a==='dokAdd'){ S.dokx.push({u:'', by:'', st:'BELUM'}); markDirty(); recompute(); render(true); focusNew(fid('dokx.'+(S.dokx.length-1)+'.u')); }
  else if(a==='dokDel'){ const j=+b.dataset.j; edit(()=>{ S.dokx.splice(j,1); }, 'Dokumen dihapus.', true); }
  else if(a==='save') save();
  else if(a==='menu') { m.hidden ? openMenu() : closeMenu(); }
  else if(a==='xlsx'){ closeMenu(); exportXlsx(); }
  else if(a==='json'){ closeMenu(); exportJson(); }
  else if(a==='import'){ closeMenu(); $('#impFile').click(); }
  else if(a==='reset'){ ui.confirmReset=true; renderMenu(); }
  else if(a==='resetNo'){ ui.confirmReset=false; renderMenu(); }
  else if(a==='resetYes'){ const sv=S.savedAt; S=defaultState(); S.savedAt=sv; ui.confirmReset=false; closeMenu(); markDirty(); recompute(); render(); toast('Data contoh dipulihkan. Tekan Simpan untuk menyimpan.'); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#menu').hidden){ closeMenu(); $('#btnMenu').focus(); } });
function renderMenu(){
  $('#menu').innerHTML = `
    <button type="button" class="mi" data-act="xlsx">Unduh Excel<small>RAB, material, rekap & input</small></button>
    <button type="button" class="mi" data-act="json">Unduh cadangan<small>File .json untuk dipulihkan nanti</small></button>
    <button type="button" class="mi" data-act="import">Pulihkan dari cadangan</button>
    <button type="button" class="mi" data-act="reset">Kembalikan ke data contoh</button>
    ${ui.confirmReset?`<div class="confirm"><span class="small">Semua isian diganti data contoh.</span><div><button type="button" class="btn primary" data-act="resetYes">Ya, ganti</button><button type="button" class="btn" data-act="resetNo">Batal</button></div></div>`:''}`;
}
function openMenu(){ renderMenu(); const m=$('#menu'), br=$('#btnMenu').getBoundingClientRect(); m.style.top=(document.querySelector('.top-row').getBoundingClientRect().bottom+6)+'px'; m.style.right=Math.max(12, window.innerWidth-br.right)+'px'; m.hidden=false; $('#btnMenu').setAttribute('aria-expanded','true'); }
function closeMenu(){ $('#menu').hidden=true; ui.confirmReset=false; $('#btnMenu').setAttribute('aria-expanded','false'); }
function setTab(t){ if(!VIEWS[t]) return; tab=t; store.set(TABK,t); render(); window.scrollTo(0,0); }
let toastT=null;
let toastUndo=null;
function toast(m, undo){ const t=$('#toast'); toastUndo=undo||null; t.innerHTML=esc(m)+(undo?' <button type="button" class="tbtn" id="toastUndo">Batalkan</button>':''); t.classList.toggle('act',!!undo); t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove('show','act'); toastUndo=null; }, undo?6500:3200); }
$('#toast').addEventListener('click', e=>{ if(e.target.id==='toastUndo' && toastUndo){ const f=toastUndo; toastUndo=null; f(); } });
function edit(fn, msg, undo){ const snap = undo ? JSON.stringify(S) : null; fn(); markDirty(); recompute(); render(true); if(msg) toast(msg, snap ? ()=>{ S=JSON.parse(snap); markDirty(); recompute(); render(true); toast('Dibatalkan.'); } : null); }
function focusNew(id){ const el=document.getElementById(id); if(el){ el.focus({preventScroll:true}); el.scrollIntoView({block:'center'}); } }
const compOf = code => S.comp[code] || (S.comp[code] = {});
function banner(h){ $('#banner').innerHTML = h ? `<div class="note">${h}</div>` : ''; }

/* ---------- simpan ---------- */
async function save(){
  if(readOnly || saving) return;
  const art = await cuse('artifact');
  if(!art){ toast('Simpan tidak tersedia di tampilan ini. Pakai menu ⋯ › Unduh cadangan.'); return; }
  saving=true; updateTop();
  const prev=S.savedAt; S.savedAt=Date.now();
  try{
    await art.publish({'project.json':{content:JSON.stringify(S), contentType:'application/json'}});
    dirty=false; baseSaved=S.savedAt; store.del(DRAFT); banner(''); toast('Tersimpan.');
  }catch(err){
    S.savedAt=prev; const c=err&&err.code;
    if(['not_writer','not_granted','consent_required','not_declared'].includes(c)){ readOnly=true; banner('Mode baca: Anda bisa mencoba angka, tetapi tidak bisa menyimpan ke halaman ini.'); }
    else if(c==='conflict') toast('Ada versi lebih baru. Halaman dimuat ulang ke versi itu.');
    else if(c==='capability_disabled'||c==='capability_removed') toast('Simpan tidak tersedia di sini. Pakai menu ⋯ › Unduh cadangan.');
    else if(c==='rate_limited') toast('Terlalu sering menyimpan. Coba lagi sebentar.');
    else toast('Gagal menyimpan. Coba lagi.');
  }finally{ saving=false; updateTop(); }
}

/* ---------- ekspor ---------- */
async function saveFile(name,data){
  const dl = await cuse('downloads');
  if(!dl){ toast('Unduhan tidak tersedia di tampilan ini.'); return; }
  try{ await dl.save({filename:name,data}); }
  catch(err){ const c=err&&err.code; toast(c==='declined'?'Unduhan dibatalkan.':c==='rate_limited'?'Masih ada unduhan yang menunggu.':'Unduhan gagal.'); }
}
const stamp = () => new Date().toISOString().slice(0,10);
function exportJson(){ saveFile('RAB_Lantai2_cadangan_'+stamp()+'.json', JSON.stringify(S,null,1)); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function sheetData(){
  const rab=[['No','Kode','Uraian','Satuan','Volume','Harga Satuan','Jumlah','Material','Upah','Alat','Kelompok','Status']];
  R.items.filter(it=>!it.off).forEach((it,i)=>rab.push([i+1,it.c,it.u,it.sat,+it.vol.toFixed(4),Math.round(it.price),Math.round(it.jumlah),Math.round(it.M),Math.round(it.U),Math.round(it.A),DATA.GRP[it.g],it.status]));
  const bom=[['Kode pekerjaan','Nama pekerjaan','Volume','Satuan','Kode material','Nama material','Satuan material','Koefisien','Kebutuhan bersih','Waste %','Kebutuhan akhir','Harga satuan','Total biaya material']];
  R.bom.forEach(b=>bom.push([b.c,b.u,+b.vol.toFixed(4),b.sat,b.rc,b.nama,b.satm,b.k,b.bersih==null?'':+b.bersih.toFixed(4),b.waste==null?'':b.waste,b.akhir==null?'':+b.akhir.toFixed(4),b.price==null?'':Math.round(b.price),Math.round(b.nilai)]));
  const rek=[['Kode','Material','Satuan','Kebutuhan bersih','Kebutuhan akhir','Satuan beli','Jumlah beli','Harga','Nilai']];
  R.bomRekap.filter(b=>b.akhir>0).forEach(b=>rek.push([b.r.c,b.r.u,b.r.sd,+b.bersih.toFixed(4),+b.akhir.toFixed(4),b.r.sb,b.beli,Math.round(b.h.base),Math.round(b.nilai)]));
  rek.push(['PS','Material di dalam Provisional Sum','','','','','','',Math.round(R.psMat)]);
  const r=R.rk;
  const sum=[['Komponen','Nilai'],['Luas bangunan tambahan (m²)',R.P.A2],['Material',Math.round(r.mat)],['Upah',Math.round(r.upah)],['Alat',Math.round(r.alat)],['Subtotal pekerjaan',Math.round(r.sub)],['Overhead',Math.round(r.OH)],['Profit',Math.round(r.PROF)],['Contingency',Math.round(r.CONT)],['PPN',Math.round(r.PPN)],['TOTAL RAB fisik',Math.round(r.FIS)],['Non-fisik',Math.round(r.NF)],['GRAND TOTAL',Math.round(r.GT)],['Grand total dibulatkan',r.GTR],['Biaya per m²',Math.round(r.PM2)],['Status kelengkapan',R.status],[],['Kelompok','Jumlah']];
  R.groups.forEach(g=>sum.push([g.g+'. '+g.name,Math.round(g.J)]));
  const inp_=[['Parameter','Nilai','Satuan','Status']];
  Object.keys(PIDX).forEach(k=>{ const rw=PIDX[k]; inp_.push([rw.u, R.P[k], rw.ty==='pct'?'fraksi':rw.unit, R.pst[k]]); });
  const kon=[['No','Item','Kategori','Kritis','Status','Kekurangan','Cek']];
  R.kon.forEach((k,ix)=>kon.push([ix+1,k.u,k.kat,k.kr,k.st,k.f==null?'manual':k.f,k.cek]));
  return {REKAP:sum,RAB:rab,BOM:bom,BOM_REKAP:rek,INPUT:inp_,KONTROL:kon};
}
async function exportXlsx(){
  if(!window.XLSX){ try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }catch(e){} }
  const d=sheetData();
  if(window.XLSX){ const X=window.XLSX, wb=X.utils.book_new(); for(const n in d) X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(d[n]), n);
    saveFile('RAB_Lantai2_'+stamp()+'.xlsx', new Blob([X.write(wb,{bookType:'xlsx',type:'array'})])); }
  else { const csv=d.RAB.map(r=>r.map(c=>{const s=String(c==null?'':c); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\n'); toast('Excel tidak termuat; mengunduh RAB sebagai CSV.'); saveFile('RAB_Lantai2_'+stamp()+'.csv','﻿'+csv); }
}
$('#impFile').addEventListener('change', e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o||!o.p||!o.h) throw 0; const sv=S.savedAt; S=mergeState(defaultState(),o); S.savedAt=sv; markDirty(); recompute(); render(); toast('Cadangan dipulihkan. Tekan Simpan.'); }catch(err){ toast('File bukan cadangan RAB yang valid.'); } e.target.value=''; };
  rd.readAsText(f); });

/* ---------- boot ---------- */
async function start(hot){
  const h=location.hash.replace('#',''), t0=VIEWS[h]?h:store.get(TABK); if(VIEWS[t0]) tab=t0;
  if(hot && hot.state){ S=mergeState(defaultState(),hot.state); dirty=!!hot.dirty; baseSaved=hot.base||0; if(hot.tab&&VIEWS[hot.tab]) tab=hot.tab; recompute(); render(); return; }
  recompute(); render();
  let loaded=null;
  try{ const r=await fetch('project.json',{cache:'no-store'}); if(r.ok) loaded=await r.json(); }catch(e){}
  if(loaded && loaded.p) S=mergeState(defaultState(),loaded);
  baseSaved=S.savedAt||0;
  try{ const d=JSON.parse(store.get(DRAFT)||'null'); if(d&&d.state&&d.base===baseSaved){ S=mergeState(defaultState(),d.state); dirty=true; banner('Perubahan yang belum disimpan dipulihkan dari perangkat ini. Tekan <b>Simpan</b>.'); } }catch(e){}
  recompute(); render();
}
const HOT = window.claude && window.claude.hot;
try{ if(HOT && typeof HOT.snapshot==='function') HOT.snapshot(()=>({state:S,dirty,base:baseSaved,tab})); }catch(e){}
if(HOT && typeof HOT.ready==='function') HOT.ready(start); else start((HOT&&HOT.data)||{});
})();
</script>
